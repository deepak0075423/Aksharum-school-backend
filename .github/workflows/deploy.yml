name: School2.0

on:
  push:
    branches:
      - main

jobs:
  # The admission module's tests (tests/admission, ~60 s) run first; a red
  # run stops the deploy. Throwaway Postgres and Redis, nothing from production.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aksharum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aksharum_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      INTERNAL_SECRET: ci-only-internal-secret
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - name: Admission module tests
        run: npm run test:admission

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd School-2.0
            git fetch --all
            git reset --hard origin/main
            npm install --production
            mkdir -p logs

            # ── nginx: ensure SSE proxying works (port 3010) ─────────
            NGINX_CONF="/etc/nginx/sites-available/default"
            if [ -f "$NGINX_CONF" ] && ! grep -q "proxy_buffering off" "$NGINX_CONF"; then
              sudo sed -i 's|proxy_pass http://localhost:3010;|proxy_pass http://localhost:3010;\n        proxy_buffering off;\n        proxy_read_timeout 86400;\n        proxy_http_version 1.1;\n        proxy_set_header Connection "";|' "$NGINX_CONF"
              echo "✅ nginx SSE config applied"
            fi
            sudo nginx -t && sudo systemctl reload nginx

            # ── PM2: always delete + fresh start with ecosystem ──────
            pm2 delete school-app 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save
