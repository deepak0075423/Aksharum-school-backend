;; ============================================================================
;;  PgBouncer — School 2.0 / aksharum_erp
;; ----------------------------------------------------------------------------
;;  Topology:   app workers ──▶ PgBouncer :6432 ──▶ PostgreSQL :5432
;;
;;  Mode: TRANSACTION pooling.
;;  This is safe here because the app has NO session-level state — audited:
;;    • no BEGIN/COMMIT/ROLLBACK (every query is single-statement autocommit)
;;    • no LISTEN/NOTIFY (real-time runs over Redis pub/sub, not Postgres)
;;    • no advisory locks, no SET / search_path, no WITH HOLD cursors
;;    • no NAMED prepared statements (node-pg uses unnamed parameterized queries)
;;  => a server backend can be handed to a different client after every query,
;;     which is what lets ~40 real backends serve thousands of app connections.
;;
;;  DO NOT switch the app to named prepared statements or session-pinned
;;  features without moving to pool_mode = session (and re-doing the math).
;;
;;  Pool math + full setup/verify/rollback steps live in ./README.md
;; ============================================================================

[databases]
;; Left side  = the db name the APP asks for (in DATABASE_URL).
;; Right side = the REAL Postgres to route it to.
;; Credentials are NOT put here — the app supplies user/password, PgBouncer
;; authenticates it against userlist.txt (see [pgbouncer] auth_* below).
aksharum_erp = host=127.0.0.1 port=5432 dbname=aksharum_erp


[pgbouncer]

;; ── Listening ───────────────────────────────────────────────────────────────
listen_addr = 127.0.0.1            ; same host / private LAN. If the app is remote,
                                   ; use 0.0.0.0 AND terminate TLS (see README).
listen_port = 6432
unix_socket_dir = /var/run/postgresql

;; ── Pooling mode — THE setting that unlocks scaling ─────────────────────────
pool_mode = transaction
;; In transaction mode the reset query is normally skipped (nothing to reset
;; between single-statement txns). Keep DISCARD ALL configured but only-when-needed.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

;; ── Pool sizing (real Postgres backends) — see README "The math" ────────────
;; default_pool_size = concurrent REAL Postgres backends per (user,database).
;; 40 fast-cycling backends comfortably serve 5k concurrent users because the
;; auth cache already absorbs the hottest read and each query holds a backend
;; only for its own duration (~single-digit ms), then returns it to the pool.
default_pool_size    = 40
;; Keep warm backends open so the 8am mass-login spike pays no cold-connect cost.
min_pool_size        = 10
;; Short-lived burst headroom borrowed when default_pool_size is fully in use.
reserve_pool_size    = 10
reserve_pool_timeout = 3
;; HARD safety belt: total real backends this pooler will ever open to Postgres,
;; across every pool/user. MUST stay under Postgres max_connections (default 100)
;; minus superuser_reserved_connections (3) and admin/monitoring headroom.
max_db_connections   = 90
max_user_connections = 90

;; ── Client side (app → pooler) — cheap, can be large ────────────────────────
;; Caps how many app-worker connections PgBouncer will accept. These are cheap
;; (a socket + small buffer); they get multiplexed onto default_pool_size above.
max_client_conn = 2000

;; ── Timeouts / load-shedding ────────────────────────────────────────────────
;; If the pool is saturated, fail a waiting client after this many seconds rather
;; than letting requests pile up. Keep BELOW the app's pg query_timeout (20s in
;; db/pool.js) so the pooler sheds load before the app's own timeout fires.
query_wait_timeout    = 15
;; Reap idle backends to release Postgres capacity during quiet periods.
server_idle_timeout   = 240
;; Recycle backends periodically (hygiene; picks up server-side config changes).
server_lifetime       = 600
;; Fail fast if Postgres itself is down/unreachable.
server_connect_timeout = 5
server_login_retry     = 2

;; ── Driver compatibility ────────────────────────────────────────────────────
;; libpq/node-pg may send startup parameters PgBouncer doesn't recognise; without
;; this, the very first connection fails with "unsupported startup parameter".
;; This is the #1 first-boot gotcha. Add any name the log complains about.
ignore_startup_parameters = extra_float_digits

;; ── Auth ────────────────────────────────────────────────────────────────────
;; Match your Postgres password encryption:
;;   Postgres 14+ default -> scram-sha-256   |   older / md5 setups -> md5
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; ── Admin / observability ───────────────────────────────────────────────────
;; Connect a console:  psql -h 127.0.0.1 -p 6432 -U pgb_admin pgbouncer
;;   then:  SHOW POOLS;  SHOW STATS;  SHOW CLIENTS;
admin_users = pgb_admin
stats_users = pgb_admin, pgb_stats

;; ── Logging ─────────────────────────────────────────────────────────────────
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
;; Keep per-connection logging OFF at 5k users or the log floods. Turn on
;; temporarily only while debugging a connection issue.
log_connections    = 0
log_disconnections = 0
log_pooler_errors  = 1
